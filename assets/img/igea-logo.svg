<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 110" width="320" height="110"
     role="img" aria-label="Logo d'IGEA, commanditaire fictif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>IGEA — Institut Général d'Entreposage et d'Assistance</title>
  <defs>
    <linearGradient id="igea-chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#4fb9ba"/>
      <stop offset="48%"  stop-color="#17807f"/>
      <stop offset="52%"  stop-color="#0d6a6a"/>
      <stop offset="100%" stop-color="#3aa3a4"/>
    </linearGradient>
    <linearGradient id="igea-swoosh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#9fd8d8"/>
      <stop offset="100%" stop-color="#0d6a6a"/>
    </linearGradient>
  </defs>

  <!-- obligatory 1997 corporate swoosh -->
  <path d="M8 86 C 70 104, 190 96, 312 60" fill="none" stroke="url(#igea-swoosh)"
        stroke-width="7" stroke-linecap="round"/>

  <!-- health cross, also a flat-pack carton -->
  <g transform="translate(10 10)">
    <rect x="0" y="0" width="74" height="74" rx="8" fill="#0d6a6a"/>
    <rect x="30" y="12" width="14" height="50" fill="#f2ede4"/>
    <rect x="12" y="30" width="50" height="14" fill="#f2ede4"/>
    <path d="M0 8 A8 8 0 0 1 8 0 L24 0 L0 24 Z" fill="#17807f"/>
  </g>

  <text x="100" y="58" font-family="'Trebuchet MS', 'Lucida Grande', Tahoma, Verdana, sans-serif"
        font-weight="700" font-size="46" letter-spacing="2" fill="url(#igea-chrome)"
        stroke="#063f3f" stroke-width="1.2">IGEA</text>
  <text x="102" y="78" font-family="Arial, Helvetica, sans-serif" font-size="10.5"
        letter-spacing="0.6" fill="#0d6a6a">VOTRE SANTÉ, EN LIBRE-SERVICE.</text>
  <text x="102" y="92" font-family="Arial, Helvetica, sans-serif" font-size="9"
        letter-spacing="0.4" fill="#5c8d8d">MONTAGE REQUIS. DEPUIS 1978.</text>
</svg>
