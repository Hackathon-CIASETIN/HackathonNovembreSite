<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 180" width="220" height="180"
     role="img" aria-label="Publicité pour une console de contrefaçon Aturdi" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>ATURDI — 1 GAJILLION DE JEUX EN 1</title>
  <defs>
    <linearGradient id="ap-boite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b1a6b"/>
      <stop offset="100%" stop-color="#0d0733"/>
    </linearGradient>
    <linearGradient id="ap-plastique" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8e6dd"/>
      <stop offset="50%" stop-color="#b9b6aa"/>
      <stop offset="100%" stop-color="#8d8a7f"/>
    </linearGradient>
  </defs>

  <rect width="220" height="180" fill="url(#ap-boite)"/>
  <rect x="3" y="3" width="214" height="174" fill="none" stroke="#ffd21a" stroke-width="2"/>

  <!-- étoile d'explosion façon étiquette de marché aux puces -->
  <g transform="translate(166 34)">
    <path d="M0 -30 L7 -10 L28 -17 L13 -2 L30 8 L9 8 L13 28 L0 14 L-13 28 L-9 8 L-30 8 L-13 -2 L-28 -17 L-7 -10 Z"
          fill="#e8290b" stroke="#ffd21a" stroke-width="1.5"/>
    <text x="0" y="0" text-anchor="middle" font-family="'Arial Black', sans-serif"
          font-size="11" fill="#fff">NEUF</text>
    <text x="0" y="11" text-anchor="middle" font-family="'Arial Black', sans-serif"
          font-size="9" fill="#ffd21a">2026</text>
  </g>

  <text x="12" y="26" font-family="'Arial Black', sans-serif" font-size="17" fill="#ffd21a">1 GAJILLION</text>
  <text x="12" y="43" font-family="'Arial Black', sans-serif" font-size="15" fill="#fff">DE JEUX EN 1</text>
  <text x="12" y="57" font-family="'Comic Sans MS', cursive" font-size="10" fill="#9fe6ff">(oui oui, un gajillion)</text>

  <!-- console générique -->
  <g transform="translate(14 72)">
    <rect x="0" y="14" width="96" height="40" rx="5" fill="url(#ap-plastique)" stroke="#2b2b2b" stroke-width="2"/>
    <rect x="8" y="22" width="52" height="9" rx="2" fill="#5c5a52"/>
    <circle cx="80" cy="27" r="4" fill="#e8290b" stroke="#2b2b2b" stroke-width="1.4"/>
    <rect x="8" y="38" width="80" height="8" rx="2" fill="#6e6b61"/>
    <!-- manette -->
    <g transform="translate(16 56)">
      <rect x="0" y="0" width="64" height="24" rx="10" fill="url(#ap-plastique)" stroke="#2b2b2b" stroke-width="2"/>
      <rect x="9" y="8" width="4" height="12" fill="#2b2b2b"/>
      <rect x="5" y="12" width="12" height="4" fill="#2b2b2b"/>
      <circle cx="48" cy="12" r="4" fill="#e8290b" stroke="#2b2b2b" stroke-width="1.2"/>
      <circle cx="57" cy="12" r="4" fill="#ffd21a" stroke="#2b2b2b" stroke-width="1.2"/>
    </g>
  </g>

  <text x="118" y="92" font-family="'Arial Black', sans-serif" font-size="13" fill="#fff">POLY</text>
  <text x="118" y="106" font-family="'Arial Black', sans-serif" font-size="13" fill="#ffd21a">STATION</text>
  <text x="118" y="122" font-family="'Comic Sans MS', cursive" font-size="9" fill="#9fe6ff">16 BIT*</text>
  <text x="118" y="134" font-family="'Comic Sans MS', cursive" font-size="7.5" fill="#b9b6ff">*pas vraiment</text>

  <rect x="8" y="150" width="204" height="22" fill="#ffd21a"/>
  <text x="110" y="165" text-anchor="middle" font-family="'Arial Black', sans-serif"
        font-size="12" fill="#0d0733">CLIQUEZ ICI !!!</text>
</svg>
