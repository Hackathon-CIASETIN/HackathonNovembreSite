<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 160" width="220" height="160"
     role="img" aria-label="Boggey Boo Plug'n Play, console fictive en forme de hibou" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Boggey Boo Plug'n Play</title>

  <defs>
    <linearGradient id="studio" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="62%" stop-color="#eceef1"/>
      <stop offset="100%" stop-color="#cfd3d9"/>
    </linearGradient>
    <radialGradient id="ombre" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#000" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    
    <linearGradient id="rose" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff95ce"/><stop offset="42%" stop-color="#e0479e"/>
      <stop offset="100%" stop-color="#8f2159"/>
    </linearGradient>
    <linearGradient id="manche" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffd0e6"/><stop offset="38%" stop-color="#e0479e"/>
      <stop offset="100%" stop-color="#99265f"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.35" cy="0.25" r="0.5">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="220" height="160" fill="url(#studio)"/>

  <ellipse cx="108" cy="140" rx="74" ry="12" fill="url(#ombre)"/>

  <!-- câbles RCA -->
  <path d="M176 112 q30 10 22 30" fill="none" stroke="#2b2b2b" stroke-width="4"/>
  <path d="M176 118 q34 14 26 34" fill="none" stroke="#2b2b2b" stroke-width="4"/>
  <g stroke="#6f6d64" stroke-width="1">
    <rect x="194" y="138" width="15" height="7" rx="2" fill="#f0e040"/>
    <rect x="198" y="148" width="15" height="7" rx="2" fill="#d94b4b"/>
  </g>

  <!-- socle -->
  <path d="M48 96 h120 a10 10 0 0 1 10 10 v18 a10 10 0 0 1 -10 10 h-120 a10 10 0 0 1 -10 -10 v-18 a10 10 0 0 1 10 -10 z"
        fill="url(#rose)" stroke="#5d1538" stroke-width="2"/>
  <rect x="52" y="118" width="26" height="4" rx="2" fill="#5d1538" opacity="0.5"/>
  <circle cx="162" cy="112" r="4" fill="#ff4d4d" stroke="#5d1538" stroke-width="1.2"/>
  <text x="108" y="130" text-anchor="middle" font-family="'Comic Sans MS','Comic Neue',cursive" font-size="9" fill="#ffe3f1">PLUG'N PLAY</text>

  <!-- tête de hibou -->
  <g>
    <ellipse cx="108" cy="72" rx="48" ry="40" fill="url(#rose)" stroke="#5d1538" stroke-width="2.5"/>
    <path d="M70 44 q6 -22 20 -8" fill="url(#rose)" stroke="#5d1538" stroke-width="2.5"/>
    <path d="M146 44 q-6 -22 -20 -8" fill="url(#rose)" stroke="#5d1538" stroke-width="2.5"/>
    <!-- yeux -->
    <circle cx="90" cy="70" r="17" fill="#fdfdfd" stroke="#5d1538" stroke-width="2.5"/>
    <circle cx="126" cy="70" r="17" fill="#fdfdfd" stroke="#5d1538" stroke-width="2.5"/>
    <circle cx="92" cy="73" r="7.5" fill="#3a4a5a"/>
    <circle cx="124" cy="73" r="7.5" fill="#3a4a5a"/>
    <circle cx="89" cy="70" r="2.6" fill="#fff"/>
    <circle cx="121" cy="70" r="2.6" fill="#fff"/>
    <path d="M108 82 l-7 9 h14 z" fill="#f0a93c" stroke="#5d1538" stroke-width="1.8"/>
    <ellipse cx="92" cy="50" rx="26" ry="14" fill="url(#gloss)"/>
  </g>

  <!-- manche de joystick -->
  <ellipse cx="108" cy="36" rx="22" ry="7" fill="#99265f" stroke="#5d1538" stroke-width="2"/>
  <path d="M100 36 q2 -26 8 -26 q6 0 8 26 z" fill="url(#manche)" stroke="#5d1538" stroke-width="2"/>
  <ellipse cx="108" cy="12" rx="9" ry="7" fill="url(#manche)" stroke="#5d1538" stroke-width="2"/>
</svg>
