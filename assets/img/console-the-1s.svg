<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 160" width="220" height="160"
     role="img" aria-label="The 1S, console portable fictive à un seul écran" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>The 1S</title>

  <defs>
    <linearGradient id="studio" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="62%" stop-color="#eceef1"/>
      <stop offset="100%" stop-color="#cfd3d9"/>
    </linearGradient>
    <radialGradient id="ombre" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#000" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    
    <linearGradient id="blanc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="55%" stop-color="#f1f1ee"/>
      <stop offset="100%" stop-color="#c9c9c4"/>
    </linearGradient>
    <linearGradient id="ecran" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a9b74"/><stop offset="100%" stop-color="#6f7152"/>
    </linearGradient>
  </defs>
  <rect width="220" height="160" fill="url(#studio)"/>

  <ellipse cx="110" cy="132" rx="88" ry="12" fill="url(#ombre)"/>
  <!-- coque -->
  <path d="M22 48 h176 a12 12 0 0 1 12 12 v52 a12 12 0 0 1 -12 12 h-176 a12 12 0 0 1 -12 -12 v-52 a12 12 0 0 1 12 -12 z"
        fill="url(#blanc)" stroke="#8d8d88" stroke-width="2"/>
  <!-- charnière centrale, vestige du deuxième écran -->
  <line x1="110" y1="48" x2="110" y2="124" stroke="#c4c4bf" stroke-width="2"/>
  <!-- écran unique -->
  <rect x="68" y="60" width="84" height="54" rx="3" fill="url(#ecran)" stroke="#55564a" stroke-width="2.5"/>
  <!-- croix directionnelle -->
  <g fill="#2fa8c4" stroke="#1d7f96" stroke-width="1.4">
    <rect x="34" y="78" width="10" height="26" rx="2"/>
    <rect x="26" y="86" width="26" height="10" rx="2"/>
  </g>
  <!-- boutons -->
  <g fill="#2fa8c4" stroke="#1d7f96" stroke-width="1.4">
    <circle cx="176" cy="78" r="6"/><circle cx="192" cy="90" r="6"/>
    <circle cx="160" cy="90" r="6"/><circle cx="176" cy="102" r="6"/>
    <rect x="160" y="56" width="14" height="6" rx="3"/>
    <rect x="180" y="56" width="14" height="6" rx="3"/>
    <rect x="30" y="56" width="20" height="6" rx="3"/>
  </g>
  <circle cx="60" cy="118" r="2.5" fill="#d8d8d3"/>
  <circle cx="160" cy="118" r="2.5" fill="#d8d8d3"/>
  <text x="110" y="34" text-anchor="middle" font-family="'Arial Black','Arial Bold',Gadget,sans-serif" font-size="24" fill="#2b2b2b">THE 1S</text>
  <text x="110" y="146" text-anchor="middle" font-family="'Comic Sans MS','Comic Neue',cursive" font-size="10" fill="#6f6d64">un écran. un seul.</text>
</svg>
