<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 190" width="150" height="190"
     role="img" aria-label="Jaquette du jeu fictif FPS MARIO" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>FPS MARIO</title>
  <defs><linearGradient id="tuy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4fd16b"/><stop offset="100%" stop-color="#1d6b32"/></linearGradient></defs>
  <rect width="150" height="190" fill="#0b1a3a"/>
  <rect width="150" height="150" fill="#0b1a3a"/>
  <!-- tuyaux génériques -->
  <g stroke="#0b3d1b" stroke-width="2.5">
    <rect x="12" y="92" width="34" height="58" fill="url(#tuy)"/>
    <rect x="6" y="82" width="46" height="14" rx="3" fill="url(#tuy)"/>
    <rect x="104" y="106" width="34" height="44" fill="url(#tuy)"/>
    <rect x="98" y="96" width="46" height="14" rx="3" fill="url(#tuy)"/>
  </g>
  <!-- vue à la première personne : gants + clé à molette -->
  <g stroke="#000" stroke-width="2.5">
    <path d="M18 150 q6 -30 30 -28 q10 1 12 10 l-4 18 z" fill="#fdfdfd"/>
    <path d="M132 150 q-6 -34 -32 -30 l-16 -26 l12 -7 l18 28 q22 6 22 35 z" fill="#fdfdfd"/>
    <rect x="86" y="58" width="13" height="30" rx="3" fill="#b9bcc9" transform="rotate(28 92 73)"/>
    <path d="M92 44 l14 -8 l7 12 l-9 5 z" fill="#b9bcc9" transform="rotate(28 100 48)"/>
  </g>
  <!-- réticule -->
  <g stroke="#ff4d4d" stroke-width="2.5" fill="none">
    <circle cx="75" cy="62" r="13"/><path d="M75 44 v8 M75 72 v8 M57 62 h8 M85 62 h8"/>
  </g>
  <rect x="0" y="150" width="150" height="40" fill="#000" opacity="0.72"/>
  <text x="75" y="169" text-anchor="middle" font-family="'Arial Black','Arial Bold',Gadget,sans-serif" font-size="15"
        fill="#ff4d4d">FPS MARIO</text>
  <rect x="0" y="0" width="150" height="190" fill="none" stroke="#000" stroke-width="5"/>
  <rect x="5" y="5" width="40" height="13" fill="#ffd21a" stroke="#000" stroke-width="1.5"/>
  <text x="25" y="15" text-anchor="middle" font-family="'Arial Black','Arial Bold',Gadget,sans-serif" font-size="8" fill="#000">ATARDI</text>
</svg>
