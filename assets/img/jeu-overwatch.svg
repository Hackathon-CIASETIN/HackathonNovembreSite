<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 190" width="150" height="190"
     role="img" aria-label="Jaquette du jeu fictif OVERWATCH" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>OVERWATCH</title>
  <defs><linearGradient id="pierre" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a2a2a"/><stop offset="100%" stop-color="#1a0d0d"/></linearGradient></defs>
  <rect width="150" height="190" fill="#2a1414"/>
  <rect width="150" height="150" fill="url(#pierre)"/>
  <!-- murs de cave génériques -->
  <g fill="#3a2020" stroke="#140a0a" stroke-width="1.5">
    <rect x="4" y="18" width="42" height="20"/><rect x="50" y="18" width="46" height="20"/>
    <rect x="100" y="18" width="46" height="20"/>
    <rect x="4" y="42" width="30" height="20"/><rect x="38" y="42" width="46" height="20"/>
    <rect x="88" y="42" width="40" height="20"/><rect x="132" y="42" width="14" height="20"/>
  </g>
  <!-- grille d'égout -->
  <rect x="48" y="86" width="54" height="40" rx="3" fill="#0d0707" stroke="#5a3a3a" stroke-width="3"/>
  <g stroke="#5a3a3a" stroke-width="3">
    <path d="M58 86 v40 M70 86 v40 M82 86 v40 M94 86 v40"/>
  </g>
  <!-- grosse larme, motif maison -->
  <path d="M26 92 q10 16 0 22 q-10 -6 0 -22 z" fill="#9fd8ff" stroke="#000" stroke-width="1.5"/>
  <path d="M124 92 q10 16 0 22 q-10 -6 0 -22 z" fill="#9fd8ff" stroke="#000" stroke-width="1.5"/>
  <rect x="0" y="150" width="150" height="40" fill="#000" opacity="0.72"/>
  <text x="75" y="169" text-anchor="middle" font-family="'Arial Black','Arial Bold',Gadget,sans-serif" font-size="14"
        fill="#ffd21a">OVERWATCH</text>
  <rect x="0" y="0" width="150" height="190" fill="none" stroke="#000" stroke-width="5"/>
  <rect x="5" y="5" width="40" height="13" fill="#ffd21a" stroke="#000" stroke-width="1.5"/>
  <text x="25" y="15" text-anchor="middle" font-family="'Arial Black','Arial Bold',Gadget,sans-serif" font-size="8" fill="#000">ATARDI</text>
</svg>
