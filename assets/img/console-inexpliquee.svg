<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 180" width="250" height="180"
     role="img" aria-label="Photo sans légende : un enfant vise un téléviseur avec un gros pistolet-jouet orange" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>(aucune légende)</title>

  <!-- tirage photo mal scanné, légèrement de travers -->
  <g transform="rotate(-2 125 90)">
    <rect x="12" y="10" width="226" height="160" fill="#fdfbf2" stroke="#c8c3b1" stroke-width="1"/>
    <rect x="18" y="16" width="214" height="136" fill="#cdbfa6"/>

    <!-- mur + plancher -->
    <rect x="18" y="16" width="214" height="96" fill="#d9cdb6"/>
    <rect x="18" y="112" width="214" height="40" fill="#9c7b55"/>

    <!-- téléviseur à tube -->
    <g transform="translate(30 44)">
      <rect x="0" y="0" width="92" height="74" rx="6" fill="#b9b3a4" stroke="#4a463c" stroke-width="2.5"/>
      <rect x="7" y="7" width="64" height="50" rx="4" fill="#4e9ad6" stroke="#2e2b24" stroke-width="2"/>
      <rect x="9" y="44" width="60" height="11" fill="#6fae52"/>
      <!-- deux canards -->
      <g fill="#2f2a22">
        <path d="M22 24 q6 -7 13 -3 q5 -5 7 1 q-3 2 -6 2 q4 5 -1 8 q-8 4 -13 -3 z"/>
        <path d="M44 34 q5 -6 11 -2 q4 -4 6 1 q-3 2 -5 2 q3 4 -1 7 q-7 3 -11 -3 z"/>
      </g>
      <circle cx="80" cy="18" r="3.5" fill="#6e6a5e"/>
      <circle cx="80" cy="30" r="3.5" fill="#6e6a5e"/>
      <rect x="76" y="42" width="9" height="14" rx="2" fill="#6e6a5e"/>
      <rect x="16" y="74" width="60" height="7" fill="#8e8779"/>
    </g>

    <!-- enfant avec un énorme pistolet-jouet en plastique orange -->
    <g transform="translate(150 44)">
      <!-- jambes -->
      <rect x="14" y="52" width="9" height="24" fill="#3f5d8f"/>
      <rect x="28" y="52" width="9" height="24" fill="#3f5d8f"/>
      <rect x="11" y="74" width="15" height="6" rx="2" fill="#2f2a22"/>
      <rect x="26" y="74" width="15" height="6" rx="2" fill="#2f2a22"/>
      <!-- torse -->
      <rect x="12" y="26" width="27" height="28" rx="4" fill="#d14f3f"/>
      <!-- tête -->
      <circle cx="25" cy="15" r="12" fill="#f0c89a" stroke="#3b2d1e" stroke-width="1.5"/>
      <path d="M13 11 q12 -11 24 0 q-6 -4 -12 -3 q-7 -1 -12 3 z" fill="#5a3a1c"/>
      <circle cx="21" cy="15" r="1.6" fill="#2f2a22"/>
      <circle cx="30" cy="15" r="1.6" fill="#2f2a22"/>
      <!-- bras tendus vers la télé -->
      <rect x="-14" y="30" width="28" height="7" rx="3.5" fill="#f0c89a"/>
      <!-- pistolet-jouet orange vif, nettement surdimensionné -->
      <g transform="translate(-54 22)">
        <rect x="0" y="6" width="46" height="13" rx="4" fill="#ff7a18" stroke="#8a3c00" stroke-width="2"/>
        <rect x="-16" y="9" width="20" height="7" rx="3" fill="#ffb15e" stroke="#8a3c00" stroke-width="1.6"/>
        <path d="M30 19 l12 0 l-3 16 l-10 0 z" fill="#ff7a18" stroke="#8a3c00" stroke-width="2"/>
        <rect x="20" y="1" width="9" height="6" rx="2" fill="#ffd21a" stroke="#8a3c00" stroke-width="1.4"/>
      </g>
    </g>

    <!-- date imprimée par l'appareil photo, comme sur un vrai tirage -->
    <text x="222" y="146" text-anchor="end" font-family="'Courier New', monospace"
          font-size="9" fill="#e8820b">17 11 1997</text>
  </g>
</svg>
