<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 230" width="600" height="230"
     role="img" aria-label="Logo d'ATARDI, commanditaire fictif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>ATARDI</title>
  <defs>
    <linearGradient id="at-chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="22%"  stop-color="#dfe6ef"/>
      <stop offset="46%"  stop-color="#8b94a3"/>
      <stop offset="50%"  stop-color="#2b3140"/>
      <stop offset="54%"  stop-color="#6d7788"/>
      <stop offset="74%"  stop-color="#cfd6e0"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="at-ruban1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6ad5"/><stop offset="100%" stop-color="#8a1a6b"/>
    </linearGradient>
    <linearGradient id="at-ruban2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7fe9ff"/><stop offset="100%" stop-color="#1157a8"/>
    </linearGradient>
    <linearGradient id="at-ruban3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe14d"/><stop offset="100%" stop-color="#d06a00"/>
    </linearGradient>
  </defs>

  <!-- rubans anguleux qui jaillissent derrière le lettrage -->
  <g stroke="#0d0f1a" stroke-width="2" stroke-linejoin="round">
    <path d="M40 150 L300 70  L300 100 L58 176 Z"  fill="url(#at-ruban2)"/>
    <path d="M30 176 L300 96  L300 126 L48 200 Z"  fill="url(#at-ruban1)"/>
    <path d="M62 120 L300 48  L300 74  L78 146 Z"  fill="url(#at-ruban3)"/>
    <path d="M96 92  L300 30  L300 52  L110 116 Z" fill="url(#at-ruban2)"/>
    <path d="M300 30 L372 24 L372 128 L300 126 Z"  fill="url(#at-ruban1)" opacity="0.92"/>
  </g>

  <!-- extrusion : copies décalées vers le bas-droite pour l'effet 3D -->
  <g fill="#161a26">
    <text x="60" y="140" font-family="'Arial Black','Arial Bold',Gadget,sans-serif"
          font-size="108" font-weight="900" letter-spacing="3" transform="translate(1 1)">ATARDI</text>
    <text x="60" y="140" font-family="'Arial Black','Arial Bold',Gadget,sans-serif"
          font-size="108" font-weight="900" letter-spacing="3" transform="translate(3 3)">ATARDI</text>
    <text x="60" y="140" font-family="'Arial Black','Arial Bold',Gadget,sans-serif"
          font-size="108" font-weight="900" letter-spacing="3" transform="translate(5 5)">ATARDI</text>
    <text x="60" y="140" font-family="'Arial Black','Arial Bold',Gadget,sans-serif"
          font-size="108" font-weight="900" letter-spacing="3" transform="translate(7 7)">ATARDI</text>
    <text x="60" y="140" font-family="'Arial Black','Arial Bold',Gadget,sans-serif"
          font-size="108" font-weight="900" letter-spacing="3" transform="translate(9 9)">ATARDI</text>
    <text x="60" y="140" font-family="'Arial Black','Arial Bold',Gadget,sans-serif"
          font-size="108" font-weight="900" letter-spacing="3" transform="translate(11 11)">ATARDI</text>
    <text x="60" y="140" font-family="'Arial Black','Arial Bold',Gadget,sans-serif"
          font-size="108" font-weight="900" letter-spacing="3" transform="translate(13 13)">ATARDI</text>
    <text x="60" y="140" font-family="'Arial Black','Arial Bold',Gadget,sans-serif"
          font-size="108" font-weight="900" letter-spacing="3" transform="translate(15 15)">ATARDI</text>
  </g>

  <!-- face avant chromée -->
  <text x="60" y="140" font-family="'Arial Black','Arial Bold',Gadget,sans-serif"
        font-size="108" font-weight="900" letter-spacing="3"
        fill="url(#at-chrome)" stroke="#0d0f1a" stroke-width="3.5"
        paint-order="stroke fill">ATARDI</text>

  <!-- reflet net sur le haut des lettres -->
  <text x="60" y="140" font-family="'Arial Black','Arial Bold',Gadget,sans-serif"
        font-size="108" font-weight="900" letter-spacing="3"
        fill="none" stroke="#ffffff" stroke-width="1" opacity="0.65">ATARDI</text>

  <text x="556" y="168" text-anchor="end"
        font-family="'Arial Black','Arial Bold',Gadget,sans-serif"
        font-size="17" fill="#ffffff" stroke="#0d0f1a" stroke-width="2.6"
        paint-order="stroke fill">depuis 1984</text>

  <text x="300" y="200" text-anchor="middle"
        font-family="'Comic Sans MS','Comic Neue',cursive"
        font-size="18" fill="#ffe86b" stroke="#2a1b00" stroke-width="0.7">
    Électronique et divertissement
  </text>
  <text x="300" y="221" text-anchor="middle"
        font-family="'Comic Sans MS','Comic Neue',cursive"
        font-size="14" fill="#9fe6ff">
    *~*~* le meilleur du jeu vidéo à petit prix *~*~*
  </text>
</svg>
