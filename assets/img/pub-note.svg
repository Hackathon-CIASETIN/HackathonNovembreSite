<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 150" width="220" height="150"
     role="img" aria-label="Publicité : votre note finale est disponible" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Votre note finale est disponible</title>
  <defs>
    <linearGradient id="pn-fond" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f7ed0"/>
      <stop offset="100%" stop-color="#0d3f73"/>
    </linearGradient>
    <linearGradient id="pn-bouton" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe14d"/>
      <stop offset="100%" stop-color="#e8a33a"/>
    </linearGradient>
  </defs>

  <rect width="220" height="150" fill="url(#pn-fond)"/>
  <rect x="3" y="3" width="214" height="144" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="7 5"/>

  <!-- bulletin de notes -->
  <g transform="translate(14 26)">
    <rect x="0" y="0" width="74" height="92" rx="3" fill="#fdfdfa" stroke="#0a2c52" stroke-width="2"/>
    <rect x="8" y="9" width="40" height="5" fill="#9fb0c4"/>
    <rect x="8" y="22" width="58" height="4" fill="#d3dbe4"/>
    <rect x="8" y="32" width="58" height="4" fill="#d3dbe4"/>
    <rect x="8" y="42" width="44" height="4" fill="#d3dbe4"/>
    <text x="37" y="76" text-anchor="middle" font-family="'Arial Black',sans-serif"
          font-size="30" fill="#1aa85a">A+</text>
  </g>

  <text x="100" y="36" font-family="'Arial Black','Arial Bold',sans-serif" font-size="14" fill="#ffe14d">FÉLICITATIONS</text>
  <text x="100" y="54" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#ffffff">Votre note finale</text>
  <text x="100" y="70" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#ffffff">est disponible&#160;!</text>
  <text x="100" y="88" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#9fd0ff">1 nouveau résultat</text>

  <rect x="98" y="100" width="108" height="26" rx="3" fill="url(#pn-bouton)" stroke="#0a2c52" stroke-width="2"/>
  <text x="152" y="117" text-anchor="middle" font-family="'Arial Black',sans-serif"
        font-size="11" fill="#0a2c52">CONSULTER</text>
</svg>
