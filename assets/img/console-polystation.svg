<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 160" width="220" height="160"
     role="img" aria-label="Console PolyStation (produit fictif)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>PolyStation</title>

  <defs>
    <linearGradient id="studio" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="62%" stop-color="#eceef1"/>
      <stop offset="100%" stop-color="#cfd3d9"/>
    </linearGradient>
    <radialGradient id="ombre" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#000" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    
    <linearGradient id="boitier" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbfbf8"/><stop offset="45%" stop-color="#d8d6cd"/>
      <stop offset="100%" stop-color="#a5a299"/>
    </linearGradient>
  </defs>
  <rect width="220" height="160" fill="url(#studio)"/>

  <ellipse cx="112" cy="132" rx="86" ry="14" fill="url(#ombre)"/>
  <!-- corps -->
  <path d="M34 66 h150 a8 8 0 0 1 8 8 v34 a8 8 0 0 1 -8 8 h-150 a8 8 0 0 1 -8 -8 v-34 a8 8 0 0 1 8 -8 z"
        fill="url(#boitier)" stroke="#6f6d64" stroke-width="2"/>
  <!-- lecteur -->
  <ellipse cx="86" cy="84" rx="36" ry="12" fill="#c6c3ba" stroke="#8a8880" stroke-width="1.6"/>
  <ellipse cx="86" cy="83" rx="27" ry="8" fill="#b3b0a7"/>
  <rect x="140" y="76" width="36" height="5" rx="2.5" fill="#b3b0a7"/>
  <rect x="140" y="86" width="26" height="5" rx="2.5" fill="#b3b0a7"/>
  <circle cx="44" cy="100" r="4" fill="#1aa85a" stroke="#6f6d64" stroke-width="1.2"/>
  <rect x="36" y="76" width="14" height="6" rx="2" fill="#b3b0a7"/>
  <!-- reflet -->
  <path d="M36 70 h146 v7 h-146 z" fill="#ffffff" opacity="0.5"/>
  <!-- manettes -->
  <g stroke="#6f6d64" stroke-width="1.8">
    <g transform="translate(26 112)">
      <rect x="0" y="0" width="54" height="20" rx="9" fill="url(#boitier)"/>
      <rect x="9" y="6" width="3.5" height="9" fill="#55534c"/><rect x="7" y="9" width="8" height="3.5" fill="#55534c"/>
      <circle cx="40" cy="10" r="3" fill="#55534c" stroke="none"/><circle cx="47" cy="10" r="3" fill="#55534c" stroke="none"/>
    </g>
    <g transform="translate(140 112)">
      <rect x="0" y="0" width="54" height="20" rx="9" fill="url(#boitier)"/>
      <rect x="9" y="6" width="3.5" height="9" fill="#55534c"/><rect x="7" y="9" width="8" height="3.5" fill="#55534c"/>
      <circle cx="40" cy="10" r="3" fill="#55534c" stroke="none"/><circle cx="47" cy="10" r="3" fill="#55534c" stroke="none"/>
    </g>
  </g>
  <text x="110" y="34" text-anchor="middle" font-family="'Arial Black','Arial Bold',Gadget,sans-serif" font-size="23" fill="#2b2b2b">POLY STATION</text>
  <text x="110" y="50" text-anchor="middle" font-family="'Comic Sans MS','Comic Neue',cursive" font-size="11" fill="#6f6d64">THE POLY MACHINE</text>
</svg>
