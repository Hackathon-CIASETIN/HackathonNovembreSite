<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 468 60" width="468" height="60"
     role="img" aria-label="Bannière publicitaire du rival fictif Michaelsoft Binbows" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>MICHAELSOFT BINBOWS</title>
  <defs>
    <linearGradient id="bb-fond" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#0a3a8c"/>
      <stop offset="55%"  stop-color="#1e6fd9"/>
      <stop offset="100%" stop-color="#7fc4ff"/>
    </linearGradient>
    <linearGradient id="bb-barre" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a8fe0"/>
      <stop offset="100%" stop-color="#17519e"/>
    </linearGradient>
  </defs>

  <rect width="468" height="60" fill="url(#bb-fond)"/>
  <rect x="1.5" y="1.5" width="465" height="57" fill="none" stroke="#001a44" stroke-width="3"/>

  <!-- une « fenêtre » générique en biseau (surtout pas un logo réel) -->
  <g transform="translate(12 10)">
    <rect x="0" y="0" width="52" height="40" fill="#d6d3cc" stroke="#001a44" stroke-width="2"/>
    <rect x="2" y="2" width="48" height="9" fill="url(#bb-barre)"/>
    <rect x="43" y="3.5" width="6" height="6" fill="#d6d3cc" stroke="#001a44" stroke-width="0.8"/>
    <rect x="6" y="16" width="30" height="3" fill="#8e8b84"/>
    <rect x="6" y="23" width="38" height="3" fill="#8e8b84"/>
    <rect x="6" y="30" width="22" height="3" fill="#8e8b84"/>
  </g>

  <text x="78" y="26" font-family="'Arial Black', sans-serif" font-size="19" fill="#ffffff"
        stroke="#001a44" stroke-width="0.8">MICHAELSOFT BINBOWS</text>
  <text x="79" y="44" font-family="'Comic Sans MS', cursive" font-size="13" fill="#ffe86b">
    Pourquoi 7 millions ? Nous en avons 7 millions ET UN.
  </text>
</svg>
